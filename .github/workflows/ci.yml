name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check ${{ matrix.server }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        server: [netbird]
    defaults:
      run:
        working-directory: servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: servers/${{ matrix.server }}/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: servers/${{ matrix.server }}/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build, test
        run: pnpm check

  image:
    # Builds on every run so a broken Dockerfile fails the PR; pushes only from main.
    name: Image ${{ matrix.server }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        server: [netbird]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Normalize image owner
        id: image_owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: servers/${{ matrix.server }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ghcr.io/${{ steps.image_owner.outputs.value }}/mcp-${{ matrix.server }}:main
            ghcr.io/${{ steps.image_owner.outputs.value }}/mcp-${{ matrix.server }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.server }}
          cache-to: type=gha,mode=max,scope=${{ matrix.server }}
